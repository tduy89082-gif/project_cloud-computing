AWSTemplateFormatVersion: '2010-09-09'
Description: CO3141 API and worker task definitions plus ECS API service and target tracking.

Parameters:
  ProjectName:
    Type: String
    Default: co3141
  ClusterName:
    Type: String
  CapacityProviderName:
    Type: String
  TargetGroupArn:
    Type: String
  ImageUri:
    Type: String
    Description: Full immutable ECR image URI, including tag (for example account.dkr.ecr.region.amazonaws.com/co3141-workload:v1).
  TaskExecutionRoleArn:
    Type: String
  LogGroupName:
    Type: String

Resources:
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-api'
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          Cpu: 256
          Memory: 512
          PortMappings:
            - ContainerPort: 8000
              HostPort: 0
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - Key: Project
          Value: CO3141
        - Key: Team
          Value: 3buanhan

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-worker'
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      Cpu: '256'
      Memory: '128'
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Cpu: 256
          Memory: 128
          Command:
            - python
            - worker.py
            - --seconds
            - '20'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
      Tags:
        - Key: Project
          Value: CO3141
        - Key: Team
          Value: 3buanhan

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiTaskDefinition
    Properties:
      ServiceName: !Sub '${ProjectName}-api-service'
      Cluster: !Ref ClusterName
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProviderName
          Weight: 1
          Base: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      PlacementStrategies:
        - Type: spread
          Field: instanceId
      TaskDefinition: !Ref ApiTaskDefinition
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroupArn
          ContainerName: api
          ContainerPort: 8000
      Tags:
        - Key: Project
          Value: CO3141
        - Key: Team
          Value: 3buanhan

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ApiService
    Properties:
      MaxCapacity: 3
      MinCapacity: 1
      ResourceId: !Sub 'service/${ClusterName}/${ApiService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ApiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-api-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 55.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 90
        ScaleOutCooldown: 60

Outputs:
  ApiServiceName:
    Value: !GetAtt ApiService.Name
  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDefinition
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
